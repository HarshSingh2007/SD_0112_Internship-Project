<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product | VendorSys</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f1f5f9;color:#1e293b;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.form-card{background:white;padding:35px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.05);width:100%;max-width:500px;}
.form-card h1{margin-bottom:25px;}
.input-box{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.input-box label{font-weight:bold;}
.input-box input{padding:14px;border:none;background:#f1f5f9;border-radius:10px;font-size:15px;}
button{width:100%;padding:14px;background:#4f46e5;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px;}
.cancel{display:block;text-align:center;margin-top:15px;color:#64748b;text-decoration:none;}
</style>
</head>
<body>

<div class="form-card">

<h1>Add Product</h1>

<form action="{{ url_for('add_product') }}" method="POST">

<div class="input-box">
<label>Product Name</label>
<input type="text" name="product_name" required>
</div>

<div class="input-box">
<label>Category</label>
<input type="text" name="category" required>
</div>

<div class="input-box">
<label>Quantity</label>
<input type="number" name="quantity" required>
</div>

<div class="input-box">
<label>Price</label>
<input type="number" step="0.01" name="price" required>
</div>

<div class="input-box">
<label>Expiry Date</label>
<input type="date" name="expiry_date" required>
</div>

<button type="submit">Add Product</button>

</form>

<a class="cancel" href="{{ url_for('products') }}">Cancel</a>

</div>

</body>
</html>
